name: R18 general-agent structural validation
on:
  push:
    branches: [hotfix/r18-general-agent-final]
  pull_request:
    branches: [hotfix/r17-final-public-schema]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  general-agent:
    name: R18-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.12.0'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python scripts/ops/verify_runtime_identity.py
      - run: python -m scripts.vnext_agent.build_r18
      - run: python -m scripts.vnext_agent.eval_r18
      - run: python -m pytest -q -o addopts= -p no:cacheprovider --junitxml=work/r18-pytest.xml
      - run: python -m scripts.vnext_agent.verify_r18 --output work/r18-audit.json
      - run: node --test tests/e2e/contract_flow.test.mjs
      - run: python scripts/benchmark/verify_jury_results.py --output work/r18-jury.json
      - run: python scripts/release/verify_final_artifacts.py
      - run: python -m scripts.vnext_agent.build_r18
      - run: git diff --exit-code -- agentes/gipuzkoa360_vnext/portal_r18 scripts/vnext_agent/dist/r18 outputs/r18/generated-corpus.json outputs/r18/real-protocol.json
      - run: git diff --check
      - if: always()
        run: python scripts/ops/verify_runtime_identity.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: r18-evidence-${{ matrix.os }}
          path: |
            work/r18-*.json
            work/r18-pytest.xml
            scripts/vnext_agent/dist/r18/*
          retention-days: 14
