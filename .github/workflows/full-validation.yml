name: Full release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python scripts/ops/verify_runtime_identity.py
      - run: python scripts/benchmark/full_validation.py --output-dir analisis/ops/full-validation
      - if: always()
        run: python scripts/ops/verify_runtime_identity.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-validation-${{ github.sha }}
          path: analisis/ops/full-validation/
          if-no-files-found: error
          retention-days: 30
