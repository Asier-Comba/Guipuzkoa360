name: Full release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python scripts/ops/verify_runtime_identity.py
      - run: python scripts/benchmark/full_validation.py --output-dir analisis/ops/full-validation
      - if: always()
        run: python scripts/ops/verify_runtime_identity.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: full-validation-${{ github.sha }}
          path: analisis/ops/full-validation/
          if-no-files-found: error
          retention-days: 30
