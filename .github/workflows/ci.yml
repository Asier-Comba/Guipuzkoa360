name: Release fast CI
on:
  pull_request:
  push:
    branches: [final/work1-engineering-master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    name: release-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.12.0'
      - name: Install without cache
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Frozen runtime before tests
        run: python scripts/ops/verify_runtime_identity.py
      - name: Python complete suite and package extraction tests
        run: python -m pytest -o addopts= -q --junitxml=work/pytest.xml
      - name: Node tests and critical syntax
        run: |
          node --test tests/e2e/contract_flow.test.mjs
          node --check scripts/jury_view.js
          node --check scripts/build_jury.mjs
          node --check scripts/build_results.mjs
      - name: Jury and artifact gates
        run: |
          python scripts/benchmark/verify_jury_results.py --output work/jury-gate.json
          python scripts/release/verify_final_artifacts.py
      - name: Package double build and context identity
        run: python scripts/ops/verify_package.py
      - name: Offline health and isolated NEXT evaluation
        run: |
          python scripts/ops/compute_source_health.py --output work/source-health.json
          python scripts/evaluation/evaluate_next.py --output-dir work/next
      - name: Frozen runtime after regeneration tests
        if: always()
        run: python scripts/ops/verify_runtime_identity.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: fast-evidence-${{ matrix.os }}
          path: |
            work/pytest.xml
            work/jury-gate.json
            work/package-gate.json
            work/source-health.json
            work/next/
            analisis/final_artifact_audit.json
            dist/*manifest.json
          if-no-files-found: warn
          retention-days: 14
