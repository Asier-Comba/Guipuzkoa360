name: Release fast CI
on:
  pull_request:
  push:
    branches: [final/work1-engineering-master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    name: release-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.12.0'
      - name: Install without cache
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Frozen runtime before tests
        run: python scripts/ops/verify_runtime_identity.py
      - name: Python complete suite and package extraction tests
        run: python -m pytest -o addopts= -q --junitxml=work/pytest.xml
      - name: Node tests and critical syntax
        run: |
          node --test tests/e2e/contract_flow.test.mjs
          node --check scripts/jury_view.js
          node --check scripts/build_jury.mjs
          node --check scripts/build_results.mjs
      - name: Jury and artifact gates
        run: |
          python scripts/benchmark/verify_jury_results.py --output work/jury-gate.json
          python scripts/release/verify_final_artifacts.py
      - name: Package double build and context identity
        run: python scripts/ops/verify_package.py
      - name: Frozen runtime after regeneration tests
        if: always()
        run: python scripts/ops/verify_runtime_identity.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fast-evidence-${{ matrix.os }}
          path: |
            work/pytest.xml
            work/jury-gate.json
            work/package-gate.json
            analisis/final_artifact_audit.json
            dist/*manifest.json
          if-no-files-found: warn
          retention-days: 14
