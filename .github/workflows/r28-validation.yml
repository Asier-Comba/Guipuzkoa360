name: R28 final input normalization validation
on:
  push:
    branches: [hotfix/r28-final-public-input-normalization]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  acceptance:
    name: R28-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.12.0'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python scripts/ops/verify_runtime_identity.py
      - run: python -m scripts.vnext_agent.build_r28
      - run: python -m pytest -q -o addopts= -p no:cacheprovider --junitxml=work/r28-pytest.xml
      - run: python -m scripts.vnext_agent.verify_r28 --output work/r28-audit.json
      - run: node --test tests/e2e/contract_flow.test.mjs
      - run: python scripts/benchmark/verify_jury_results.py --output work/r28-jury.json
      - run: python scripts/release/verify_final_artifacts.py
      - run: python -c "from scripts.vnext_agent.build_r28 import build; a=build(); b=build(); assert a==b; print(a)"
      - run: git diff --exit-code -- agentes/gipuzkoa360_vnext/portal_r28
      - run: git diff --check
      - if: always()
        run: python scripts/ops/verify_runtime_identity.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: r28-evidence-${{ matrix.os }}
          path: |
            work/r28-*.json
            work/r28-pytest.xml
            scripts/vnext_agent/dist/r28/*
          retention-days: 14
